{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="Complaint list pages">
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>
    {% if page_obj.has_previous %}<a href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Previous</a>{% endif %}
    {% if page_obj.has_next %}<a href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next →</a>{% endif %}
  </div>
</nav>{% endif %}
